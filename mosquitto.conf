# Mosquitto MQTT Broker Configuration
listener 1883
allow_anonymous true

# WebSocket support
listener 9001
protocol websockets
allow_anonymous true

# Logging
# The eclipse-mosquitto image has no /var/log/mosquitto, so the old
# `log_dest file /var/log/mosquitto/mosquitto.log` made the broker exit at
# startup. stdout puts the log where `docker compose logs mqtt` can read it.
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# Persistence
# Must match the image layout (/mosquitto/data is the mounted volume);
# /var/lib/mosquitto/ does not exist in this image.
persistence true
persistence_location /mosquitto/data/

# Auto save
autosave_interval 1800
